<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中山公司信息索引表</title>
<style>
  :root {
    --brand: #1f4e79;
    --brand-light: #2e75b6;
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #243447;
    --text-muted: #6b7c93;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }

  /* ---------- 顶部标题 + 搜索栏 ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 2px 10px rgba(31, 78, 121, 0.06);
  }
  .topbar-inner {
    max-width: 1080px;
    margin: 0 auto;
    padding: 18px 20px 14px;
  }
  .page-title {
    margin: 0 0 12px;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--brand);
    text-align: center;
  }
  .search-wrap {
    position: relative;
    max-width: 560px;
    margin: 0 auto;
  }
  #searchInput {
    width: 100%;
    padding: 11px 40px 11px 40px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 999px;
    outline: none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }
  #searchInput:focus {
    background: #ffffff;
    border-color: var(--brand-light);
    box-shadow: 0 0 0 3px rgba(46, 117, 182, 0.15);
  }
  .search-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }
  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: 16px;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }
  .clear-btn:hover { background: #eef2f7; color: var(--brand); }
  .meta {
    margin-top: 10px;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }

  /* ---------- 链接卡片网格：默认每行 3 个 ---------- */
  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px 40px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    padding: 18px 18px 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-left: 4px solid var(--brand-light);
    border-radius: var(--radius);
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 3px rgba(31, 78, 121, 0.06);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover {
    transform: translateY(-3px);
    border-left-color: var(--brand);
    box-shadow: 0 8px 20px rgba(31, 78, 121, 0.14);
  }
  .card:focus-visible {
    outline: 2px solid var(--brand-light);
    outline-offset: 2px;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--brand);
    word-break: break-word;
  }
  .card-desc {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .empty {
    margin: 34px 0 0;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }
  [hidden] { display: none !important; }

  /* ---------- 响应式：窄屏每行 2 个 / 1 个 ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 600px) {
    .topbar-inner { padding: 14px 14px 12px; }
    .page-title { font-size: 20px; }
    .container { padding: 16px 14px 32px; }
    .grid { grid-template-columns: 1fr; gap: 12px; }
  }

  .page-foot {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 30px;
    text-align: center;
    font-size: 12px;
    color: #9aa8bb;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1 class="page-title">中山公司信息索引表</h1>
    <div class="search-wrap">
      <span class="search-icon">&#128269;</span>
      <input id="searchInput" type="search" placeholder="搜索链接名称…" autocomplete="off" aria-label="搜索链接名称">
      <button id="clearBtn" type="button" class="clear-btn" title="清空搜索" hidden>&times;</button>
    </div>
    <div class="meta"><span id="counter" aria-live="polite"></span></div>
  </div>
</header>

<main class="container">

  <!-- ============================================================
       链接列表（显示顺序 = 下面的排列顺序）
       ------------------------------------------------------------
       ★ 新增链接方法：复制下面这段模板，粘贴到 </div> 之前，
         修改 href（目标文件名）、card-title（链接名称）、
         card-desc（一行说明，可删除整行）；data-keywords 用于
         补充搜索关键词（可省略）。

       <a class="card" href="文件名.html" data-keywords="补充关键词 空格分隔">
         <div class="card-title">链接名称</div>
         <div class="card-desc">这里写一句话说明</div>
       </a>
       ============================================================ -->
  <div class="grid" id="linkGrid">

    <!-- 条目 1 -->
    <a class="card" href="yz.html" data-keywords="远程桌面 远程连接 VPN 开启 被控端">
      <div class="card-title">远程桌面开启与VPN使用指引</div>
      <div class="card-desc">收录使用指引文档</div>
    </a>

    <!-- ↓↓↓ 从这里往下继续添加新条目（保持每行 3 个自动排列） ↓↓↓ -->

  </div>

  <p class="empty" id="emptyTip" hidden>没有匹配的链接，换个关键词试试。</p>
</main>

<div class="page-foot">中山公司信息索引表 · 点击卡片打开对应页面</div>

<script>
(function () {
  var input = document.getElementById('searchInput');
  var clearBtn = document.getElementById('clearBtn');
  var grid = document.getElementById('linkGrid');
  var counter = document.getElementById('counter');
  var emptyTip = document.getElementById('emptyTip');
  var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));

  // 预先缓存每张卡片的搜索文本：链接名称 + 说明 + data-keywords 补充词
  cards.forEach(function (card) {
    var title = card.querySelector('.card-title');
    var desc = card.querySelector('.card-desc');
    var parts = [
      title ? title.textContent : '',
      desc ? desc.textContent : '',
      card.getAttribute('data-keywords') || ''
    ];
    card.dataset.searchText = parts.join(' ').toLowerCase();
  });

  function applyFilter() {
    var keyword = input.value.trim().toLowerCase();
    var visible = 0;

    cards.forEach(function (card) {
      var hit = keyword === '' || card.dataset.searchText.indexOf(keyword) !== -1;
      card.hidden = !hit;
      if (hit) { visible++; }
    });

    counter.textContent = keyword === ''
      ? '共 ' + cards.length + ' 条链接'
      : '匹配 ' + visible + ' / ' + cards.length + ' 条链接';
    emptyTip.hidden = !(keyword !== '' && visible === 0);
    clearBtn.hidden = keyword === '';
  }

  input.addEventListener('input', applyFilter);

  clearBtn.addEventListener('click', function () {
    input.value = '';
    applyFilter();
    input.focus();
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      input.value = '';
      applyFilter();
    }
  });

  applyFilter();
})();
</script>

</body>
</html>
